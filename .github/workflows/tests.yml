name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts/humanoid_qa/tests -t scripts
      - run: python -m unittest discover -s scripts/showcase/tests
      - run: python -m pip install pytest
      - run: python -m pytest -q
